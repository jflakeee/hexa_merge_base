<title>미디어 서버로 이동 중…</title>

<meta http-equiv="refresh" content="0; url=https://desktop-f6utbg1.tail2b18d8.ts.net:8443/">
<style>

  p.muted { color: #94a3b8; font-size: 0.9rem; margin: 0.2rem 0 0.8rem; }

    display: inline-block; padding: 0.8rem 1.5rem; border-radius: 10px;
    background: #38bdf8; color: #0f172a; text-decoration: none; font-weight: 700;
    font-size: 1.05rem;
  }
  a.btn:active { transform: translateY(1px); }

</head>

  <div class="card">

  <script>

    var TARGET = "https://desktop-f6utbg1.tail2b18d8.ts.net:8443/";
    document.getElementById("go").href = TARGET;
    // history 에 남기지 않고 즉시 이동(뒤로가기 무한루프 방지)
    location.replace(TARGET);
  </script>

  <noscript>
    <p><a href="https://desktop-f6utbg1.tail2b18d8.ts.net:8443/">미디어 서버 열기 →</a></p>
