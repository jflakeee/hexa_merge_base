<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Home Portal — 공개 배포</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6fb;--panel:#fff;--border:#e2e8f0;--strong:#cbd5e1;--ink:#0f172a;--soft:#475569;--faint:#94a3b8;--accent:#0ea5e9;--ring:rgba(14,165,233,.45);--shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06);--shadow-h:0 2px 6px rgba(15,23,42,.10),0 16px 40px rgba(15,23,42,.14)}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1120;--panel:#131c31;--border:#24314b;--strong:#33425f;--ink:#eef2f9;--soft:#a7b4cc;--faint:#6b7a97;--accent:#38bdf8;--ring:rgba(56,189,248,.5);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-h:0 2px 8px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5)}}
    :root[data-theme=light]{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--border:#e2e8f0;--strong:#cbd5e1;--ink:#0f172a;--soft:#475569;--faint:#94a3b8;--accent:#0ea5e9;--ring:rgba(14,165,233,.45);--shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06);--shadow-h:0 2px 6px rgba(15,23,42,.10),0 16px 40px rgba(15,23,42,.14)}
    :root[data-theme=dark]{color-scheme:dark;--bg:#0b1120;--panel:#131c31;--border:#24314b;--strong:#33425f;--ink:#eef2f9;--soft:#a7b4cc;--faint:#6b7a97;--accent:#38bdf8;--ring:rgba(56,189,248,.5);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-h:0 2px 8px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.5}.mono{font-family:ui-monospace,Consolas,monospace}
    header{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.bar{max-width:1180px;margin:auto;padding:16px 24px 12px;display:flex;flex-direction:column;gap:12px}.brand,.left,.controls,.chips{display:flex;align-items:center;gap:12px}.brand{justify-content:space-between;flex-wrap:wrap}.mark{font-size:1.3rem;font-weight:750;display:flex;align-items:center;gap:9px}.glyph{width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,var(--accent),#a78bfa);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}.sub{color:var(--faint);font-size:.83rem}.sub b{color:var(--soft)}
    button,input{font:inherit}.theme,.chip{border:1px solid var(--strong);background:var(--panel);color:var(--soft);cursor:pointer}.theme{font-size:.83rem;padding:7px 13px;border-radius:9px}.theme:hover,.chip:hover{border-color:var(--accent);color:var(--ink)}button:focus-visible,input:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}.controls{flex-wrap:wrap}.search{position:relative;flex:1 1 240px}.search input{width:100%;padding:10px 14px 10px 38px;background:var(--panel);color:var(--ink);border:1px solid var(--strong);border-radius:10px;outline:none}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}.chips{gap:8px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:999px;font-size:.82rem}.chip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-color:var(--accent);color:var(--ink)}
    main{max-width:1180px;margin:auto;padding:24px 24px 72px}.group{margin-bottom:32px}.group.hidden{display:none}.group-head{display:flex;align-items:center;gap:10px;margin:0 2px 14px}.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}.group-head h2{margin:0;font-size:1.02rem}.count{color:var(--faint);font-size:.82rem}.rule{height:1px;flex:1;background:var(--border)}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:15px 16px 13px;border-radius:13px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:.16s;overflow:hidden}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c)}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}.name{font-size:.95rem;font-weight:650;word-break:break-all}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}.tag{font-size:.7rem;font-weight:600;color:color-mix(in srgb,var(--c) 72%,var(--soft));background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 8px;border-radius:6px}.act{font-size:.78rem;font-weight:600;color:var(--accent)}.empty{display:none;text-align:center;color:var(--faint);padding:60px}.empty.show{display:block}@media(max-width:560px){.bar{padding:12px 16px}main{padding:18px 16px 60px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
  </style>
</head>
<body>
  <header><div class="bar">
    <div class="brand"><span class="left"><span class="mark"><span class="glyph"></span>Home Portal</span><span class="sub">공개 배포 · <b id="total">0</b>개</span></span><button class="theme" id="theme" type="button">테마</button></div>
    <div class="controls"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="프로그램·그룹 검색…" autocomplete="off" aria-label="검색"></label><div class="chips" id="chips"></div></div>
  </div></header>
  <main id="main"></main><p class="empty" id="empty">검색 결과가 없습니다.</p>
  <script>
    const links=[
      {name:'hexa_merge_base',group:'게임',url:'https://www.fungood.co.kr/hexa_merge_base/'},{name:'hexa-merge-clone',group:'게임',url:'https://jflakeee.github.io/hexa-merge-clone/'},{name:'hexa_merge_web',group:'게임',url:'https://jflakeee.github.io/hexa_merge_web/'},{name:'sudoku_clone',group:'게임',url:'https://jflakeee.github.io/sudoku_clone/'},{name:'sudoku_league',group:'게임',url:'https://jflakeee.github.io/sudoku_league/'},{name:'minecraft_base',group:'게임',url:'https://jflakeee.github.io/minecraft_base/'},{name:'diablo',group:'게임',url:'https://jflakeee.github.io/diablo/'},{name:'number_drop',group:'게임',url:'https://jflakeee.github.io/number_drop/'},{name:'number_drop_base',group:'게임',url:'https://jflakeee.github.io/number_drop_base/'},{name:'number_drop_clone',group:'게임',url:'https://jflakeee.github.io/number_drop_clone/'},{name:'game_portal',group:'게임',url:'https://jflakeee.github.io/game_portal/'},{name:'bible_clone',group:'학습·도구',url:'https://jflakeee.github.io/bible_clone/'},{name:'duolingo_base',group:'학습·도구',url:'https://jflakeee.github.io/duolingo_base/'},{name:'jflakeee.github.io',group:'홈',url:'https://jflakeee.github.io/'}
    ];
    const colors={'게임':'#a78bfa','학습·도구':'#22d3ee','홈':'#8b98ad'},order=['게임','학습·도구','홈'];let active='';
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){main.innerHTML=order.map(g=>{const items=links.filter(x=>x.group===g);return `<section class="group" data-group="${g}" style="--c:${colors[g]}"><div class="group-head"><span class="dot"></span><h2>${g}</h2><span class="count">${items.length}</span><span class="rule"></span></div><div class="grid">${items.map(x=>`<a class="card" href="${esc(x.url)}" target="_blank" rel="noopener" data-name="${esc((x.name+' '+g).toLowerCase())}"><span class="name mono">${esc(x.name)}</span><span class="foot"><span class="tag">${g}</span><span class="act">열기 ↗</span></span></a>`).join('')}</div></section>`}).join('');total.textContent=links.length;buildChips();apply()}
    function buildChips(){chips.innerHTML='';['',...order].forEach(g=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=g||'전체';b.setAttribute('aria-pressed',String(active===g));b.onclick=()=>{active=g;buildChips();apply()};chips.appendChild(b)})}
    function apply(){const term=q.value.trim().toLowerCase();let shown=0;document.querySelectorAll('.group').forEach(sec=>{let n=0;sec.querySelectorAll('.card').forEach(card=>{const ok=(!active||sec.dataset.group===active)&&(!term||card.dataset.name.includes(term));card.hidden=!ok;if(ok)n++});sec.classList.toggle('hidden',n===0);shown+=n});empty.classList.toggle('show',shown===0)}
    q.addEventListener('input',apply);theme.onclick=()=>{const root=document.documentElement,now=root.dataset.theme;root.dataset.theme=now==='dark'?'light':now==='light'?'': 'dark';try{localStorage.setItem('portal-theme',root.dataset.theme)}catch(e){}};try{document.documentElement.dataset.theme=localStorage.getItem('portal-theme')||''}catch(e){}render();
  </script>
</body>
</html>
